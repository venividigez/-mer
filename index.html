<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VVG | Sosyal Etkinlik Topluluğu</title>
    <link rel="stylesheet" href="style.css">
    </head>
<body>

    <div class="container" style="max-width: 1000px; margin: 0 auto; padding: 40px 20px;">
        <h2 style="text-align: center; color: #C5A059; margin-bottom: 40px;">Sıradaki Etkinlikler</h2>
        <div class="events-grid" id="events-container">
            <p class="loading">Etkinlik takvimi güncelleniyor...</p>
        </div>
    </div>

    <script>
        // Saat Fonksiyonu
        function updateVVGClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
            const clockEl = document.getElementById('vvg-clock');
            if(clockEl) clockEl.innerHTML = timeString;
        }
        setInterval(updateVVGClock, 1000);
        updateVVGClock();

        // Notion Veri Yükleyici
        async function loadEvents() {
            const container = document.getElementById('events-container');
            const API_URL = "https://notion-api.splitbee.io/v1/table/36c48bd5f3fe800d886dd34a20c35203";
            
            try {
                const response = await fetch(API_URL);
                const events = await response.json();
                container.innerHTML = ''; 

                events.forEach(event => {
                    if (event.Name) {
                        container.innerHTML += `
                            <div class="event-card">
                                <div class="event-date">${event.Date || 'Tarih Belirtilmemiş'}</div>
                                <h3>${event.Name}</h3>
                                <p>📍 Konum: ${event["Column 3"] || '-'}</p>
                                <p>👥 Kontenjan: ${event.Description || '-'}</p>
                                <p>🔥 Kalan: ${event["Column 4"] || '-'}</p>
                            </div>
                        `;
                    }
                });
            } catch (err) {
                container.innerHTML = '<p style="color:red;">Veriler yüklenemedi. Notion "Publish to web" ayarını kontrol edin.</p>';
            }
        }
        loadEvents();
    </script>
</body>
</html>
