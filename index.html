<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VVG | Sosyal Etkinlik Topluluğu</title>

<meta name="description" content="VVG - Sosyal Etkinlik Topluluğu. Çevreni değiştir, hayatın değişsin.">
<meta name="keywords" content="VVG, sosyal etkinlik, networking, kamp, seyahat">

<link rel="canonical" href="https://venividigez.com">

<meta property="og:title" content="VVG | Sıradan Çevrelerden Fazlası">
<meta property="og:description" content="Çevreni değiştir, hayatın değişsin.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://venividigez.com">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
scroll-behavior:smooth;
}

body{
background:#0b0b0b;
color:white;
font-family:'Inter',sans-serif;
overflow-x:hidden;
}

a{
text-decoration:none;
}

section{
padding:100px 20px;
}

.container{
max-width:1200px;
margin:auto;
}

.text-gold{
color:#D4AF37;
}

.glass-nav{
position:fixed;
top:0;
left:0;
width:100%;
padding:20px 40px;
display:flex;
justify-content:space-between;
align-items:center;
z-index:9999;
background:rgba(0,0,0,0.45);
backdrop-filter:blur(12px);
border-bottom:1px solid rgba(255,255,255,0.05);
}

.logo{
font-size:1.7rem;
font-family:'Playfair Display',serif;
letter-spacing:4px;
color:#D4AF37;
}

.nav-links{
display:flex;
gap:25px;
align-items:center;
}

.nav-links a{
color:white;
font-size:0.95rem;
transition:0.3s;
}

.nav-links a:hover{
color:#D4AF37;
}

.btn-outline{
padding:10px 18px;
border:1px solid #D4AF37;
color:#D4AF37;
border-radius:50px;
transition:0.3s;
}

.btn-outline:hover{
background:#D4AF37;
color:black;
}

.hero{
height:100vh;
position:relative;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
overflow:hidden;
}

.hero video{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
top:0;
left:0;
z-index:-2;
}

.overlay{
position:absolute;
width:100%;
height:100%;
background:rgba(0,0,0,0.55);
z-index:-1;
}

.hero-content{
max-width:900px;
padding:20px;
}

.hero h1{
font-size:5rem;
font-family:'Playfair Display',serif;
font-weight:400;
line-height:1.1;
margin-bottom:25px;
}

.hero p{
font-size:1.15rem;
color:#d1d1d1;
margin-bottom:40px;
}

.hero-buttons{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
}

.btn-gold{
padding:15px 32px;
background:#D4AF37;
color:black;
border-radius:50px;
font-weight:600;
transition:0.3s;
}

.btn-gold:hover{
transform:translateY(-3px);
box-shadow:0 10px 30px rgba(212,175,55,0.3);
}

.btn-glass{
padding:15px 32px;
border:1px solid rgba(255,255,255,0.2);
background:rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
color:white;
border-radius:50px;
transition:0.3s;
}

.btn-glass:hover{
border-color:#D4AF37;
}

.manifesto{
text-align:center;
background:#111;
}

.manifesto h2{
font-size:3rem;
font-family:'Playfair Display',serif;
margin-bottom:20px;
line-height:1.3;
}

.manifesto p{
color:#b1b1b1;
}

.stats{
background:#0f0f0f;
}

.stats-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:40px;
text-align:center;
}

.stat-box h3{
font-size:3rem;
margin-bottom:10px;
color:white;
}

.stat-box p{
color:#999;
}

.events-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:30px;
margin-top:60px;
}

.event-card{
background:#161616;
padding:35px;
border:1px solid #222;
transition:0.3s;
position:relative;
overflow:hidden;
}

.event-card:hover{
transform:translateY(-6px);
border-color:#D4AF37;
}

.event-date{
color:#D4AF37;
font-size:0.85rem;
letter-spacing:2px;
margin-bottom:15px;
}

.event-title{
font-size:1.5rem;
margin-bottom:20px;
}

.event-desc{
color:#aaa;
line-height:1.7;
}

.section-title{
text-align:center;
font-size:3rem;
font-family:'Playfair Display',serif;
margin-bottom:20px;
}

.section-sub{
text-align:center;
color:#888;
max-width:700px;
margin:0 auto 50px;
}

.countdown{
text-align:center;
background:#111;
border-top:1px solid #222;
border-bottom:1px solid #222;
}

#countdown{
font-size:4rem;
margin-top:20px;
}

.testimonials{
background:#0d0d0d;
}

.testimonial-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:30px;
}

.testimonial{
background:#151515;
border:1px solid #222;
padding:35px;
}

.testimonial p{
line-height:1.8;
color:#ddd;
font-style:italic;
}

.testimonial span{
display:block;
margin-top:20px;
color:#D4AF37;
}

.apply-section{
background:#101010;
text-align:center;
}

.glass-form{
max-width:700px;
margin:auto;
padding:50px;
background:rgba(255,255,255,0.03);
border:1px solid rgba(255,255,255,0.08);
backdrop-filter:blur(15px);
}

.glass-form h2{
font-size:2.5rem;
margin-bottom:20px;
font-family:'Playfair Display',serif;
}

.glass-form p{
color:#aaa;
margin-bottom:35px;
}

.footer{
padding:70px 20px 40px;
background:#080808;
text-align:center;
border-top:1px solid rgba(255,255,255,0.05);
}

.footer-links{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
margin:30px 0;
}

.footer-links a{
color:#999;
}

.footer-links a:hover{
color:white;
}

.floating-btn{
position:fixed;
bottom:25px;
right:25px;
z-index:99999;
}

.floating-btn a{
background:#D4AF37;
color:black;
padding:15px 25px;
border-radius:50px;
font-weight:600;
box-shadow:0 10px 30px rgba(212,175,55,0.35);
}

.cursor-glow{
width:20px;
height:20px;
border-radius:50%;
background:rgba(212,175,55,0.5);
position:fixed;
pointer-events:none;
z-index:999999;
filter:blur(5px);
mix-blend-mode:screen;
}

@media(max-width:768px){

.hero h1{
font-size:3rem;
}

.manifesto h2{
font-size:2rem;
}

#countdown{
font-size:2rem;
}

.glass-nav{
padding:20px;
}

.nav-links{
display:none;
}

}

</style>

</head>

<body>

<div class="cursor-glow" id="cursorGlow"></div>

<nav class="glass-nav">

<div class="logo">VVG</div>

<div class="nav-links">
<a href="#manifesto">Manifesto</a>
<a href="#events">Events</a>
<a href="#journal">Journal</a>
<a href="#payment">Ödeme</a>
<a href="#apply" class="btn-outline">Başvuru</a>
</div>

</nav>

<header class="hero">

<video autoplay muted loop playsinline>
<source src="assets/videos/acilis.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="hero-content">

<h1>
Çevreni Değiştir,<br>
<span class="text-gold">Hayatın Değişsin.</span>
</h1>

<p class="hero-sub">
Sıradan çevrelerden fazlasını arayanlar için tasarlandı.
</p>

<div class="hero-buttons">
<a href="#apply" class="btn-gold">Başvuru Yap</a>
<a href="#events" class="btn-glass">Etkinlikleri Gör</a>
</div>

</div>

</header>

<section id="manifesto" class="manifesto">

<div class="container">

<h2>
“Herkesle değil,<br>
doğru insanlarla tanış.”
</h2>

<p>
81 şehir, tek frekans.
</p>

</div>

</section>

<section class="stats">

<div class="container">

<div class="stats-grid">

<div class="stat-box">
<h3>81</h3>
<p>Şehir</p>
</div>

<div class="stat-box">
<h3>12K+</h3>
<p>Başvuru</p>
</div>

<div class="stat-box">
<h3>430+</h3>
<p>Etkinlik</p>
</div>

<div class="stat-box">
<h3>Private</h3>
<p>Community</p>
</div>

</div>

</div>

</section>
